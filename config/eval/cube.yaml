# OGBench cube-single CEM eval -- config/eval/scene.yaml with the scene's four object factors
# reduced to the one the cube env has. Same solver, cost path, normalization rule and marker-off
# render; the driver (scripts/eval_cem.py) picks this config from a checkpoint whose train_meta
# names a cube_play* dataset and reads task sets cube_offset_tasks_O<k>.
defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/OGBCube-v0
  env_type: single
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set to 2*eval_budget in eval.py
  ob_type: states
  width: 224
  height: 224
  terminate_at_goal: True
  visualize_info: False   # the env's goal marker (a translucent cube at the target) never enters the observation

dataset:
  stats: cube_play               # action normalization stats; the driver overrides with the TRAINING file's
  keys_to_cache:
    - action

seed: 42
policy: ??? # REQUIRED: trained ckpt, e.g. lewm/<run>/weights_epoch_N.pt (no random fallback)


plan_config:
  horizon: 5
  receding_horizon: 3
  action_block: 5    # must equal the checkpoint's training frameskip (asserted)

eval:
  num_eval: 100
  goal_offset_steps: 25
  eval_budget: 60
  img_size: 224
  dataset_name: cube_offset_tasks_O25
  callables:
    # -- set init sim state (cube set_state takes qpos, qvel only)
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- success target from the task goal config (goal_* = value at goal frame)
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_block_pos

output:
  filename: scene_results.txt
