defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/OGBScene-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set to 2*eval_budget in eval.py
  ob_type: states
  width: 224
  height: 224
  terminate_at_goal: True
  visualize_info: False   # the env's goal marker (a translucent cube at the target) never enters the observation

dataset:
  stats: scene_play              # action normalization stats (training data, not the tiny task set)
  keys_to_cache:
    - action

seed: 42
policy: ??? # REQUIRED: trained ckpt, e.g. lewm/<run>/weights_epoch_N.pt, or random


plan_config:
  horizon: 5
  receding_horizon: 3
  action_block: 5    # must equal the checkpoint's training frameskip (asserted)

eval:
  num_eval: 100
  goal_offset_steps: 25
  eval_budget: 60
  img_size: 224
  dataset_name: scene_offset_tasks_O25
  callables:
    # -- set init sim state (scene set_state requires button_state_* kwargs)
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
        button_state_0:
          value: button_state_0
        button_state_1:
          value: button_state_1
    # -- success targets from the task goal config (goal_* = value at goal frame)
    - method: set_cube_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_block_pos
    - method: set_target_button_state
      args:
        button_id:
          value: 0
          in_dataset: False
        target_state:
          value: goal_button_state_0
    - method: set_target_button_state
      args:
        button_id:
          value: 1
          in_dataset: False
        target_state:
          value: goal_button_state_1
    - method: set_target_drawer_pos
      args:
        target_pos:
          value: goal_drawer_pos
    - method: set_target_window_pos
      args:
        target_pos:
          value: goal_window_pos

output:
  filename: scene_results.txt
