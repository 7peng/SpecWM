# scene: within-clip quasimetric kernel (cached teacher latents) on the play corpus, predictions as queries.
#   MUJOCO_GL=egl python src/train_spec.py --config-name=scene_clip_quasimetric run_id=scene_clip_quasimetric-1
defaults:
- env: scene
- _self_
seed: 3072
full_ckpt_every_n_steps: 1500
optim_modules: (model)
wandb:
  config:
    project: lewm-scene-within
data:
  dataset:
    name: scene_play_qmz_fs5
    keys_to_load:
    - pixels
    - action
    - qpos
    - teacher_z
    keys_to_cache:
    - action
    - qpos
    path: ${oc.env:SCENE_STAGE_DIR}/scene_play_qmz_fs5.h5
    raw_columns:
    - qpos
trainer:
  max_epochs: 1
scheduler:
  warmup_epochs: 0.05
loader:
  batch_size: 24
wm:
  num_preds: 20
  max_pred_horizon: 1
  pred_norm: true
model:
  predictor:
    _target_: networks.ARPredictor
  projector:
    norm_fn:
      _target_: torch.nn.LayerNorm
  pred_proj:
    norm_fn:
      _target_: torch.nn.LayerNorm
loss:
  sigreg:
    weight: 0
  spectral:
    scope: clip
    weight: 1.0
    queries: predictions
    min_live: 0.5
    anchor:
      weight: 2.0
      stop_gradient: false
    teachers:
      linear_fs5:
        spec: scene_linear_fs5
        ckpt: ${oc.env:STABLEWM_HOME}/checkpoints/lewm/scene-qrl-linear-fs5-1/step_snaps/step_9000.pt
        symmetrize: mean
    cached_key: teacher_z
    factors:
    - form: quasimetric_cached
      teacher: linear_fs5
      slice:
      - 0
      - 384
      sigma: 5.9611
      weight: 1.0
      monitor: linear_fs5
      orient: true
step_snapshots:
  stop: 240000
  every: 1000
