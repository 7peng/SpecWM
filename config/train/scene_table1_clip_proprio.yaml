# scene: Table 1, underspecified (within-clip) proprioception kernel on the late-onset mixture.
#   MUJOCO_GL=egl python src/train_spec.py --config-name=scene_table1_clip_proprio run_id=scene_table1_clip_proprio-1
defaults:
- env: scene
- _self_
seed: 2
full_ckpt_every_n_steps: 1500
optim_modules: (model)
wandb:
  config:
    project: lewm-scene-within
data:
  dataset:
    name: scene_play_mix_lateonset
    keys_to_load:
    - pixels
    - action
    - qpos
    keys_to_cache:
    - action
    - qpos
    path: ${oc.env:SCENE_STAGE_DIR}/scene_play_mix_lateonset.h5
    raw_columns:
    - qpos
trainer:
  max_epochs: 1
  max_steps: 33375
scheduler:
  warmup_epochs: 0.05
loader:
  batch_size: 24
wm:
  num_preds: 20
  max_pred_horizon: 1
  pred_norm: true
model:
  predictor:
    _target_: networks.ARPredictor
  projector:
    norm_fn:
      _target_: torch.nn.LayerNorm
  pred_proj:
    norm_fn:
      _target_: torch.nn.LayerNorm
loss:
  sigreg:
    weight: 0
  spectral:
    scope: clip
    weight: 1.0
    queries: rows
    score_diagonal: true
    min_live: 0.5
    anchor:
      weight: 2.0
      stop_gradient: false
    factors:
    - name: proprio
      key: qpos
      slice:
      - 0
      - 6
      form: laplace
      embed: cos_sin
      sigma: 0.7350662350654602
      weight: 1.0
      monitor: proprio
step_snapshots:
  stop: 240000
  every: 1000
