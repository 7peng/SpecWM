# calvin: SpecWM, temporal kernel.
#   MUJOCO_GL=egl python src/train_spec.py --config-name=calvin_temporal run_id=calvin_temporal-1
defaults:
- env: calvin
- _self_
full_ckpt_every_n_steps: 1500
optim_modules: (model)
wandb:
  config:
    project: lewm-calvin-within
data:
  dataset:
    name: calvin_abc_d_mix_lateonset
    path: ${oc.env:CALVIN_STAGE_DIR}/calvin_abc_d_mix_lateonset.h5
    keys_to_load:
    - pixels
    - action
    - scene_obs
    - robot_obs
    - ep_idx
    - step_idx
    keys_to_cache:
    - action
    - scene_obs
    - robot_obs
    - ep_idx
    - step_idx
    raw_columns: []
    far_frames: 8
    far_gap:
    - 300
    - 3000
trainer:
  max_epochs: 1
  max_steps: 33375
scheduler:
  warmup_epochs: 0.05
loader:
  batch_size: 24
wm:
  num_preds: 20
  max_pred_horizon: 1
  pred_norm: true
model:
  predictor:
    _target_: networks.ARPredictor
  projector:
    norm_fn:
      _target_: torch.nn.LayerNorm
  pred_proj:
    norm_fn:
      _target_: torch.nn.LayerNorm
loss:
  sigreg:
    weight: 0
  spectral:
    scope: clip
    weight: 2.0
    queries: rows
    score_diagonal: true
    min_live: 0.5
    anchor:
      weight: 2.0
      stop_gradient: false
    factors:
    - form: temporal
      sigma: 7.0
      weight: 1.0
      monitor: lag
    - form: temporal
      sigma: 45.0
      weight: 1.0
      monitor: lag_far
step_snapshots:
  stop: 240000
  every: 1000
