# @package _global_
# Shared by every scene recipe: corpus layout, probes, chassis and optimiser.
hydra:
  job:
    chdir: false
run_id: ???
split_seed: 3072
output_model_name: lewm
img_size: 224
train_split: 0.9
auto_resume: true
val_split_by_episode: true
num_workers: 8
encoder_opt: region
fused_predictor_attn: true
compile_predictor: true
val_num_workers: 0
wandb:
  enabled: true
  config:
    name: ${run_id}
    id: ${run_id}
    resume: allow
    log_model: false
data:
  dataset:
    num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
    frameskip: 5
trainer:
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  limit_val_batches: 8
  val_check_interval: 500
  check_val_every_n_epoch: null
  devices: 1
loader:
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: false
optimizer:
  type: MuonAdamW
  weight_decay: 0.001
  lr: 7.3e-05
  muon_lr: 0.001461
  nonmatrix_lr: 0.0002922
wm:
  history_size: 3
  embed_dim: 192
model:
  _target_: jepa.JEPA
  embed_dim: ${wm.embed_dim}
  emb_norm: ${oc.select:wm.emb_norm,true}
  pred_norm: ${oc.select:wm.pred_norm,false}
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: tiny
    patch_size: 14
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    num_frames: ${wm.history_size}
    input_dim: ${wm.embed_dim}
    hidden_dim: ${wm.embed_dim}
    output_dim: ${wm.embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: networks.Embedder
    input_dim: ???
    emb_dim: ${wm.embed_dim}
  projector:
    _target_: networks.MLP
    input_dim: ${wm.embed_dim}
    output_dim: ${wm.embed_dim}
    hidden_dim: 2048
    norm_fn:
      _partial_: true
  pred_proj:
    _target_: networks.MLP
    input_dim: ${wm.embed_dim}
    output_dim: ${wm.embed_dim}
    hidden_dim: 2048
    norm_fn:
      _partial_: true
loss:
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024
probe:
  within_episode: true
  enabled: true
  every_n_epochs: 1
  n_frames: 5000
  pixels_key: pixels
  reps:
  - emb
  - cls
  ridge_alpha: cv
  n_splits: 5
  mlp: true
  excess: true
  excess_covariate: arm
  seed: 0
  targets:
  - cube_xyz=qpos[14:17]
  - drawer=qpos[23]
  - window=qpos[24]
  - buttons=button_states
  - arm=qpos[0:7]
suite_probe:
  enabled: true
  pack: ${oc.env:OGBENCH_PACK_DIR}/scene
  every_n_steps: 500
  batch: 512
  groups: null
  log_per_cell: true
  dtype: fp16
step_snapshots:
  start: 1000
