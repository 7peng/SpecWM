# scene: fully specified state kernel, batch scope, tempered.
#   MUJOCO_GL=egl python src/train_spec.py --config-name=scene_full_state run_id=scene_full_state-1
defaults:
- env: scene
- _self_
seed: 3072
full_ckpt_every_n_steps: 1500
optim_modules: (model)
wandb:
  config:
    project: lewm-scene-within
data:
  dataset:
    name: scene_play
    keys_to_load:
    - pixels
    - action
    - qpos
    - observation
    keys_to_cache:
    - action
    - qpos
    - observation
    path: ${oc.env:SCENE_STAGE_DIR}/scene_play.h5
    raw_columns:
    - qpos
    - observation
trainer:
  max_epochs: 1
scheduler:
  warmup_epochs: 0.05
loader:
  batch_size: 24
wm:
  num_preds: 20
  max_pred_horizon: 1
  pred_norm: true
model:
  predictor:
    _target_: networks.ARPredictor
  projector:
    norm_fn:
      _target_: torch.nn.LayerNorm
  pred_proj:
    norm_fn:
      _target_: torch.nn.LayerNorm
loss:
  sigreg:
    weight: 0
  spectral:
    scope: batch
    weight: 1.0
    temper:
      alpha: 0.5
      modes: 128
      center: true
    normalise: entry
    min_live: 0.5
    anchor:
      weight: 0.05
      stop_gradient: false
    factors:
    - key: observation
      form: laplace
      sigma: 5.6042
      weight: 1.0
step_snapshots:
  stop: 240000
  every: 1000
