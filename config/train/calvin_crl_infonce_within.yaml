# calvin: temporal InfoNCE on one shared representation with within-clip negatives: every frame but a clip's last is an
# anchor, its positive 1 + Geometric(1 - 0.8669) frames later drawn from that law truncated to the clip, its negatives
# every other goal in the batch (its own clip's included, less goals at its own frame or its positive's frame); softmax
# on h_a . h_g / sqrt(d), no heads, no actions. Same clips and images per update as SpecWM.
# The 8 far frames per clip (same episode, 300-3000 raw frames away) join every anchor's goals as negatives,
# so the images per update are SpecWM's 24 x (23 + 8) = 744.
#   MUJOCO_GL=egl python src/train_spec.py --config-name=calvin_crl_infonce_within run_id=calvin_crl_infonce_within-1
defaults:
- env: calvin
- _self_
full_ckpt_every_n_steps: 1500
optim_modules: (model)
wandb:
  config:
    project: lewm-calvin-within
data:
  dataset:
    name: calvin_abc_d_mix_lateonset
    path: ${oc.env:CALVIN_STAGE_DIR}/calvin_abc_d_mix_lateonset.h5
    keys_to_load:
    - pixels
    - action
    - scene_obs
    - robot_obs
    - ep_idx
    - step_idx
    keys_to_cache:
    - action
    - scene_obs
    - robot_obs
    - ep_idx
    - step_idx
    raw_columns: []
    far_frames: 8
    far_gap:
    - 300
    - 3000
trainer:
  max_epochs: 1
  max_steps: 33375
scheduler:
  warmup_epochs: 0.05
loader:
  batch_size: 24
wm:
  num_preds: 20
  max_pred_horizon: 1
  pred_norm: true
model:
  predictor:
    _target_: networks.ARPredictor
  projector:
    norm_fn:
      _target_: torch.nn.LayerNorm
  pred_proj:
    norm_fn:
      _target_: torch.nn.LayerNorm
loss:
  sigreg:
    weight: 0
  crl:
    weight: 2.0
    form: infonce
    discount: 0.8669
    positives: truncated
    negatives: all
    anchor:
      weight: 2.0
      stop_gradient: false
step_snapshots:
  stop: 240000
  every: 1000
