# calvin: contrastive RL baseline, OGBench CRL's value critic on our encoder: separate phi and psi heads (their
# GCBilinearValue MLPs, Adam 3e-4 as theirs) on the shared encoder row, their binary NCE summed over each anchor's goals
# (OGBench's pair mean is the same objective up to a constant under Adam), no actions. Pairs follow OGBench's GCDataset:
# 11 per clip (264 per update), anchors uniform over the fitting episodes' frames, goals 1 + Geometric(1 - 0.99) env
# steps later in the same episode (their discount), every other goal in the batch a negative. The 24 clips carry the
# prediction anchor as in SpecWM; the pairs add 528 images per update.
# No far frames: 24 x 23 + 528 = 1,080 images per update against SpecWM's 744.
#   MUJOCO_GL=egl python src/train_spec.py --config-name=calvin_crl_heads run_id=calvin_crl_heads-1
defaults:
- env: calvin
- _self_
full_ckpt_every_n_steps: 1500
optim_modules: (model)
head_optim:
  modules: crl_heads
  optimizer:
    type: Adam
    lr: 0.0003
wandb:
  config:
    project: lewm-calvin-within
data:
  dataset:
    name: calvin_abc_d_mix_lateonset
    goal_pairs:
      n: 11
      discount: 0.99
    path: ${oc.env:CALVIN_STAGE_DIR}/calvin_abc_d_mix_lateonset.h5
    keys_to_load:
    - pixels
    - action
    - scene_obs
    - robot_obs
    - ep_idx
    - step_idx
    keys_to_cache:
    - action
    - scene_obs
    - robot_obs
    - ep_idx
    - step_idx
    raw_columns: []
trainer:
  max_epochs: 1
  max_steps: 33375
scheduler:
  warmup_epochs: 0.05
loader:
  batch_size: 24
wm:
  num_preds: 20
  max_pred_horizon: 1
  pred_norm: true
model:
  predictor:
    _target_: networks.ARPredictor
  projector:
    norm_fn:
      _target_: torch.nn.LayerNorm
  pred_proj:
    norm_fn:
      _target_: torch.nn.LayerNorm
loss:
  sigreg:
    weight: 0
  crl:
    weight: 2.0
    form: binary
    reduction: anchor_sum
    heads:
      hidden_dims: [512, 512, 512]
      latent_dim: 512
      layer_norm: true
    anchor:
      weight: 2.0
      stop_gradient: false
step_snapshots:
  stop: 240000
  every: 1000
